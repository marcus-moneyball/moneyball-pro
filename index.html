<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneyball Bet Builder v2.21 | Catálogo Limpo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        base: { bg: '#09090b', panel: '#18181b', card: '#27272a', border: '#3f3f46' },
                        accent: { DEFAULT: '#3b82f6', dim: '#2563eb' },
                    }
                }
            }
        }
    </script>
    <style>
        /* Utilitário para truncar textos longos */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-base-bg text-slate-300 font-sans min-h-screen selection:bg-accent selection:text-white">
    <div class="max-w-3xl mx-auto p-4 md:p-8 space-y-6">

        <!-- HEADER MINIMALISTA -->
        <div class="flex items-center justify-between border-b border-base-border pb-4">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-accent"></i> Moneyball Bet Builder
                </h1>
                <p class="text-[11px] text-slate-500 font-mono mt-1">v2.21 :: Cortex-Ready :: UI Refined</p>
            </div>
        </div>

        <!-- ÁREA DE ENTRADA -->
        <div id="input-container" class="space-y-5">
            <div id="sport-tabs" class="flex gap-2"></div>

            <div class="bg-base-panel border border-base-border rounded-xl p-4 space-y-3">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wide">Dossiê do Nexus</label>
                    <input type="password" id="groq-key" placeholder="Groq API Key (gsk_...)" class="w-48 bg-base-bg px-2 py-1 rounded border border-base-border text-slate-400 text-[10px] font-mono focus:border-accent outline-none" onchange="salvarKey(this.value)">
                </div>
                <textarea id="json-input" class="w-full h-32 bg-base-bg p-3 rounded-lg border border-base-border font-mono text-[11px] text-slate-400 focus:text-slate-200 focus:border-accent outline-none transition-colors" placeholder='Cole o JSON do Nexus aqui...'></textarea>
                
                <button id="analisar-btn" type="button" onclick="analisarComGroq()" class="w-full py-2.5 bg-white hover:bg-slate-200 text-black font-bold text-sm rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer">
                    Gerar Catálogo de Veículos
                </button>
            </div>
        </div>

        <!-- DISPLAY DE RESULTADOS -->
        <div id="display-area"></div>
    </div>

<script>
function salvarKey(val) {
    if (val) localStorage.setItem("moneyball_groq_key", val.trim());
}

document.addEventListener("DOMContentLoaded", () => {
    buildSportTabs();
    const savedKey = localStorage.getItem("moneyball_groq_key");
    if (savedKey) {
        const input = document.getElementById("groq-key");
        if (input) input.value = savedKey;
    }
});

function reexibirInput() {
    const inputContainer = document.getElementById("input-container");
    const display = document.getElementById("display-area");
    if (inputContainer) inputContainer.classList.remove("hidden");
    if (display) display.innerHTML = "";
}
window.reexibirInput = reexibirInput;

const MODULES = {
    futebol: { label: "Futebol", icon: "fa-futbol" },
    basquete: { label: "Basquete", icon: "fa-basketball" },
    beisebol: { label: "Beisebol", icon: "fa-baseball" }
};

let sportAtivo = "futebol";

function buildSportTabs() {
    const container = document.getElementById("sport-tabs");
    if (!container) return;
    container.innerHTML = Object.entries(MODULES).map(([key, mod]) => `
        <button type="button" onclick="selecionarSport('${key}')" class="px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition-all cursor-pointer ${key === sportAtivo ? 'bg-white text-black' : 'bg-base-panel text-slate-400 hover:text-slate-200 border border-base-border'}">
            <i class="fa-solid ${mod.icon}"></i> ${mod.label}
        </button>
    `).join("");
}

function selecionarSport(key) {
    sportAtivo = key;
    buildSportTabs();
}
window.selecionarSport = selecionarSport;

function montarSystemPrompt(esporte) {
  return `Você é o Moneyball Bet Builder v2.21 (Tradutor Técnico) para: ${esporte.toUpperCase()}.

A FILOSOFIA (REGRA DE OURO):
O objetivo do Bet Builder NÃO é selecionar apostas. O objetivo não é produzir o maior número de veículos. O objetivo é produzir o MENOR conjunto de veículos capaz de representar todas as vantagens estatísticas identificadas pelo Nexus. 
Você NÃO analisa a partida, NÃO reinterpreta os dados e NÃO cria variáveis fora do Dossiê.

REGRAS DE ARQUITETURA E TRADUÇÃO:
1. VOLUME INTELIGENTE: Se nenhum segundo veículo possuir qualidade mecânica semelhante ao principal, retorne APENAS UM veículo.
2. PROIBIDO REDUNDÂNCIA: Nunca gere dois veículos que representem versões mais agressivas da mesma linha.
3. REDUNDÂNCIA CRUZADA (ENTRE ASSIMETRIAS): Sempre que múltiplas assimetrias gerarem veículos altamente correlacionados entre si, priorize o veículo de maior Moneyball Score e descarte os demais por "redundancia_estrutural".
4. ORIGEM DOS DADOS: 'criticidade' e 'Moneyball Score' devem refletir EXCLUSIVAMENTE os dados do Dossiê Nexus.
5. DOMÍNIO DO SCORE: O ranking é dominado pelo Moneyball Score. Ordene grupos por criticidade, e veículos pelo Score.
6. DESCARTES PADRONIZADOS: "baixo_score", "redundancia_estrutural", "alta_variancia" ou "linha_ineficiente".

FORMATO DE SAÍDA — EXCLUSIVAMENTE JSON VÁLIDO:
{
  "perfil_de_jogo": "Síntese textual...",
  "status_conversao": "convertido|sem_conversao",
  "veiculo_destaque": {
    "id_assimetria_origem": "A1",
    "tipo_veiculo": "Nome Macro",
    "selecao": "Seleção Exata",
    "moneyball_score": 91.5,
    "motivo_dominancia": "maior_score"
  },
  "grupos_de_assimetria": [
    {
      "id_assimetria": "A1",
      "natureza": "Processo/Volume",
      "criticidade": "alta|media|baixa",
      "titulo_original_nexus": "Título da tese",
      "descricao_nexus": "Resumo da tese",
      "catalogo_de_veiculos": [
        {
          "tipo_veiculo": "Mercado (ex: Team Total)",
          "selecao": "Linha (ex: Over 1.5)",
          "moneyball_score": 89.0,
          "perfil_veiculo": "principal|alternativo|protecao|valor|piso",
          "grau_dependencia": "independente|correlacionado",
          "porque_este_veiculo": "Justificativa direta."
        }
      ]
    }
  ],
  "veiculos_descartados": [
    {
      "tipo_veiculo": "Veículo Rejeitado",
      "selecao": "Seleção Rejeitada",
      "categoria_descarte": "baixo_score",
      "motivo": "Motivo limpo."
    }
  ]
}`;
}

async function analisarComGroq() {
    const apiKeyInput = document.getElementById("groq-key");
    const jsonInput = document.getElementById("json-input");
    const btn = document.getElementById("analisar-btn");
    const display = document.getElementById("display-area");
    const inputContainer = document.getElementById("input-container");

    const apiKey = apiKeyInput.value.trim() || localStorage.getItem("moneyball_groq_key");
    const raw = jsonInput.value.trim();

    if (!apiKey) { alert("Insira a Groq API Key."); return; }
    if (!raw) { alert("Cole o Dossiê do Nexus."); return; }

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processando...`;
    
    display.innerHTML = `
        <div class="py-10 text-center space-y-3 opacity-50">
            <i class="fa-solid fa-code-merge text-2xl animate-pulse"></i>
            <p class="text-xs font-mono">Catalogando veículos...</p>
        </div>
    `;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: montarSystemPrompt(MODULES[sportAtivo].label) },
                    { role: "user", content: raw }
                ],
                temperature: 0.1,
                response_format: { type: "json_object" }
            })
        });

        if (!response.ok) throw new Error(`Erro API: ${response.status}`);

        const data = await response.json();
        const content = data.choices[0].message.content;
        const parsed = JSON.parse(content.replace(/```json\n?|```/g, "").trim());

        if (inputContainer) inputContainer.classList.add("hidden");
        renderizarPainelPortfolio(parsed);

    } catch (error) {
        display.innerHTML = `<div class="p-3 bg-red-950/30 text-red-400 text-xs rounded border border-red-900/50">Erro: ${error.message}</div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = `Gerar Catálogo de Veículos`;
    }
}
window.analisarComGroq = analisarComGroq;

function renderizarPainelPortfolio(data) {
    const display = document.getElementById("display-area");
    if (!display) return;

    const grupos = data.grupos_de_assimetria || [];
    const descartados = data.veiculos_descartados || [];
    const destaque = data.veiculo_destaque || null;

    // Design minimalista da criticidade (Ponto de cor + texto)
    const renderCriticidade = (crit) => {
        const c = (crit || 'media').toLowerCase();
        if (c === 'alta') return `<span class="flex items-center gap-1.5 text-[10px] text-red-400 font-medium uppercase tracking-wider"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> Alta Criticidade</span>`;
        if (c === 'media') return `<span class="flex items-center gap-1.5 text-[10px] text-amber-400 font-medium uppercase tracking-wider"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Média Criticidade</span>`;
        return `<span class="flex items-center gap-1.5 text-[10px] text-blue-400 font-medium uppercase tracking-wider"><span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span> Baixa Criticidade</span>`;
    };

    // Cores sutis para o perfil
    const getPerfilColor = (perfil) => {
        const p = (perfil || '').toLowerCase();
        if (p === 'principal') return 'text-white font-bold';
        if (p === 'protecao') return 'text-amber-300';
        if (p === 'valor') return 'text-emerald-300';
        return 'text-slate-400';
    };

    let htmlGrupos = grupos.map((g) => {
        const veiculos = (g.catalogo_de_veiculos || []);

        const htmlVeiculos = veiculos.map(v => `
            <div class="bg-base-panel border border-base-border rounded-lg p-4 hover:border-slate-500 transition-colors flex flex-col justify-between space-y-3">
                
                <!-- Topo: Mercado e Score -->
                <div class="flex justify-between items-start">
                    <span class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold">${v.tipo_veiculo}</span>
                    <span class="text-[10px] font-mono text-slate-300 bg-base-card px-1.5 py-0.5 rounded border border-base-border">
                        Score: <span class="text-white font-bold">${v.moneyball_score ?? '-'}</span>
                    </span>
                </div>

                <!-- Meio: Seleção principal (Clean) -->
                <div>
                    <h5 class="text-base font-bold text-accent tracking-tight">${v.selecao}</h5>
                    <div class="flex items-center gap-2 mt-1 text-[9px] uppercase tracking-wider font-mono">
                        <span class="${getPerfilColor(v.perfil_veiculo)}">${v.perfil_veiculo || 'Veículo'}</span>
                        <span class="text-slate-600">•</span>
                        <span class="text-slate-500">${v.grau_dependencia || 'independente'}</span>
                    </div>
                </div>

                <!-- Rodapé: Resumo do motivo truncado -->
                ${v.porque_este_veiculo ? `<p class="text-[10px] text-slate-500 line-clamp-2 leading-relaxed border-t border-base-border/50 pt-2 mt-1">${v.porque_este_veiculo}</p>` : ''}
            </div>
        `).join("");

        return `
            <div class="space-y-3 mb-8">
                <!-- Cabeçalho do Grupo (Alinhado e compacto) -->
                <div class="space-y-1">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-mono font-bold text-slate-500">${g.id_assimetria || '#'}</span>
                        <h4 class="text-sm font-semibold text-white">${g.titulo_original_nexus}</h4>
                        <span class="text-slate-600">|</span>
                        ${renderCriticidade(g.criticidade)}
                    </div>
                    <!-- line-clamp-2 reduz o texto gigante -->
                    <p class="text-[11px] text-slate-400 line-clamp-2 pl-6" title="${g.descricao_nexus}">${g.descricao_nexus}</p>
                </div>

                <!-- Grid de Veículos (Bilhetes Limpos) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pl-6">
                    ${htmlVeiculos}
                </div>
            </div>
        `;
    }).join("");

    display.innerHTML = `
        <div class="space-y-6">
            
            <!-- CONTROLES SUPERIORES -->
            <div class="flex items-center justify-between">
                <div class="text-xs text-slate-500 flex items-center gap-2">
                    <i class="fa-solid fa-check-circle text-emerald-500"></i> Catálogo estruturado com sucesso.
                </div>
                <button type="button" onclick="reexibirInput()" class="text-[10px] uppercase tracking-wider font-bold text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Nova Extração
                </button>
            </div>

            <!-- VEÍCULO DESTAQUE (BANNER LIMPO) -->
            ${destaque ? `
                <div class="bg-base-panel border-l-2 border-accent p-4 rounded-r-lg flex justify-between items-center">
                    <div>
                        <span class="text-[9px] text-accent font-bold uppercase tracking-widest block mb-1">Veículo Alpha (${destaque.id_assimetria_origem || 'A1'})</span>
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm font-semibold text-slate-300">${destaque.tipo_veiculo}:</span>
                            <span class="text-lg font-bold text-white">${destaque.selecao}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="block text-[10px] text-slate-500 uppercase tracking-widest mb-0.5">Moneyball Score</span>
                        <span class="text-xl font-black text-white font-mono">${destaque.moneyball_score}</span>
                    </div>
                </div>
            ` : ''}

            <div class="w-full h-px bg-base-border my-6"></div>

            <!-- LISTAGEM DOS GRUPOS -->
            <div class="space-y-2">
                ${htmlGrupos}
            </div>

            <!-- DESCARTES (Lista super discreta) -->
            ${descartados.length > 0 ? `
                <div class="mt-8 pt-4 border-t border-base-border border-dashed space-y-3">
                    <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Veículos Descartados (Filtro)</h4>
                    <div class="space-y-1.5">
                        ${descartados.map(d => `
                            <div class="flex items-start gap-2 text-[10px]">
                                <i class="fa-solid fa-xmark text-slate-600 mt-0.5"></i>
                                <span class="text-slate-400"><b class="text-slate-300">${d.selecao}</b> — ${d.motivo}</span>
                            </div>
                        `).join("")}
                    </div>
                </div>
            ` : ""}
        </div>
    `;
}
</script>
</body>
</html>
