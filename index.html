<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneyball Bet Builder v2.22 | UI Balanceada</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        base: { bg: '#05070d', panel: '#0d1220', card: '#111827', border: '#1f2937' },
                        accent: { DEFAULT: '#8b5cf6', dim: '#6d28d9' },
                    }
                }
            }
        }
    </script>
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-base-bg text-slate-200 font-sans min-h-screen" style="background-image: radial-gradient(circle at 50% 0%, rgba(139,92,246,0.08), transparent 60%);">
    <div class="max-w-3xl mx-auto p-4 md:p-8 space-y-6">

        <!-- HEADER -->
        <div class="text-center space-y-2 pt-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accent/10 border border-accent/20 text-[10px] font-bold text-accent tracking-widest uppercase">
                <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span> Bet Builder v2.22 — Cortex-Ready
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">🚀 Moneyball Bet Builder</h1>
        </div>

        <!-- ÁREA DE ENTRADA -->
        <div id="input-container" class="space-y-6">
            <div id="sport-tabs" class="grid grid-cols-3 gap-2"></div>

            <details class="bg-base-panel border border-base-border rounded-2xl p-4" open>
                <summary class="cursor-pointer text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-key text-accent"></i> Configuração da API Groq
                </summary>
                <div class="mt-4 space-y-2">
                    <input type="password" id="groq-key" placeholder="gsk_..." class="w-full bg-base-bg p-2.5 rounded-lg border border-base-border text-white text-sm font-mono" onchange="salvarKey(this.value)">
                </div>
            </details>

            <div class="bg-base-panel border border-base-border rounded-2xl p-6 space-y-3 shadow-xl shadow-black/20">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-accent/20 text-accent text-xs font-bold flex items-center justify-center">1</span>
                    <label class="text-sm font-semibold text-slate-300">Cole o Dossiê do Nexus</label>
                </div>
                <textarea id="json-input" class="w-full h-40 bg-base-bg p-3 rounded-lg border border-base-border font-mono text-xs text-emerald-400 focus:border-accent outline-none" placeholder='Cole o Dossiê investigativo do Nexus aqui...'></textarea>
                <button id="analisar-btn" type="button" onclick="analisarComGroq()" class="w-full py-3.5 bg-accent hover:bg-accent-dim font-bold rounded-xl text-white shadow-lg shadow-accent/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-bolt"></i> Extrair Catálogo de Veículos
                </button>
            </div>
        </div>

        <!-- DISPLAY DE RESULTADOS -->
        <div id="display-area"></div>
    </div>

<script>
function salvarKey(val) {
    if (val) localStorage.setItem("moneyball_groq_key", val.trim());
}

document.addEventListener("DOMContentLoaded", () => {
    buildSportTabs();
    const savedKey = localStorage.getItem("moneyball_groq_key");
    if (savedKey) {
        const input = document.getElementById("groq-key");
        if (input) input.value = savedKey;
    }
});

function reexibirInput() {
    const inputContainer = document.getElementById("input-container");
    const display = document.getElementById("display-area");
    if (inputContainer) inputContainer.classList.remove("hidden");
    if (display) display.innerHTML = "";
}
window.reexibirInput = reexibirInput;

const MODULES = {
    futebol: { label: "Futebol", icon: "fa-futbol" },
    basquete: { label: "Basquete", icon: "fa-basketball" },
    beisebol: { label: "Beisebol", icon: "fa-baseball" }
};

let sportAtivo = "futebol";

function buildSportTabs() {
    const container = document.getElementById("sport-tabs");
    if (!container) return;
    container.innerHTML = Object.entries(MODULES).map(([key, mod]) => `
        <button type="button" onclick="selecionarSport('${key}')" class="py-3 px-4 rounded-xl border text-xs font-bold flex items-center justify-center gap-2 transition-all cursor-pointer ${key === sportAtivo ? 'bg-accent/15 border-accent text-accent shadow-lg shadow-accent/10' : 'bg-base-panel border-base-border text-slate-400 hover:border-slate-700'}">
            <i class="fa-solid ${mod.icon}"></i> ${mod.label}
        </button>
    `).join("");
}

function selecionarSport(key) {
    sportAtivo = key;
    buildSportTabs();
}
window.selecionarSport = selecionarSport;

function montarSystemPrompt(esporte) {
  return `Você é o Moneyball Bet Builder v2.22 (Tradutor Técnico) para: ${esporte.toUpperCase()}.

A FILOSOFIA (REGRA DE OURO):
O objetivo do Bet Builder NÃO é selecionar apostas. O objetivo não é produzir o maior número de veículos. O objetivo é produzir o MENOR conjunto de veículos capaz de representar todas as vantagens estatísticas identificadas pelo Nexus. 
Você NÃO analisa a partida, NÃO reinterpreta os dados e NÃO cria variáveis fora do Dossiê.

REGRAS DE ARQUITETURA E TRADUÇÃO:
1. VOLUME INTELIGENTE: Se nenhum segundo veículo possuir qualidade semelhante ao principal, retorne APENAS UM veículo.
2. PROIBIDO REDUNDÂNCIA: Nunca gere dois veículos que representem versões mais agressivas da mesma linha.
3. REDUNDÂNCIA CRUZADA (ENTRE ASSIMETRIAS): Sempre que múltiplas assimetrias gerarem veículos altamente correlacionados entre si, priorize o veículo de maior Moneyball Score e descarte os demais por "redundancia_estrutural".
4. ORIGEM DOS DADOS: 'criticidade' e 'Moneyball Score' devem refletir EXCLUSIVAMENTE os dados do Dossiê Nexus.
5. DOMÍNIO DO SCORE: Ordene grupos por criticidade, e veículos pelo Score (do maior para o menor).
6. DESCARTES PADRONIZADOS: "baixo_score", "redundancia_estrutural", "alta_variancia" ou "linha_ineficiente".

FORMATO DE SAÍDA — EXCLUSIVAMENTE JSON VÁLIDO:
{
  "perfil_de_jogo": "Síntese textual vinda estritamente do Nexus...",
  "status_conversao": "convertido|sem_conversao",
  "veiculo_destaque": {
    "id_assimetria_origem": "A1",
    "tipo_veiculo": "Nome Macro",
    "selecao": "Seleção Exata",
    "moneyball_score": 91.5,
    "motivo_dominancia": "maior_score"
  },
  "grupos_de_assimetria": [
    {
      "id_assimetria": "A1",
      "natureza": "Processo/Volume",
      "criticidade": "alta|media|baixa",
      "titulo_original_nexus": "Título da tese",
      "descricao_nexus": "Resumo da tese",
      "catalogo_de_veiculos": [
        {
          "tipo_veiculo": "Mercado",
          "selecao": "Linha Exata",
          "moneyball_score": 89.0,
          "odd": "1.85",
          "perfil_veiculo": "principal|alternativo|protecao|valor|piso",
          "grau_dependencia": "independente|correlacionado",
          "porque_este_veiculo": "Justificativa mecânica."
        }
      ]
    }
  ],
  "veiculos_descartados": [
    {
      "tipo_veiculo": "Veículo Rejeitado",
      "selecao": "Seleção Rejeitada",
      "categoria_descarte": "baixo_score|redundancia_estrutural",
      "motivo": "Motivo limpo."
    }
  ]
}`;
}

async function analisarComGroq() {
    const apiKeyInput = document.getElementById("groq-key");
    const jsonInput = document.getElementById("json-input");
    const btn = document.getElementById("analisar-btn");
    const display = document.getElementById("display-area");
    const inputContainer = document.getElementById("input-container");

    const apiKey = apiKeyInput.value.trim() || localStorage.getItem("moneyball_groq_key");
    const raw = jsonInput.value.trim();

    if (!apiKey) { alert("Insira a Groq API Key."); return; }
    if (!raw) { alert("Cole o Dossiê do Nexus."); return; }

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Estruturando Grafo...`;
    
    display.innerHTML = `
        <div class="bg-base-panel border border-base-border rounded-2xl p-8 text-center space-y-3 animate-pulse">
            <i class="fa-solid fa-network-wired text-accent text-3xl"></i>
            <h3 class="text-sm font-semibold text-slate-300">Catalogando Veículos...</h3>
        </div>
    `;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: montarSystemPrompt(MODULES[sportAtivo].label) },
                    { role: "user", content: raw }
                ],
                temperature: 0.1,
                response_format: { type: "json_object" }
            })
        });

        if (!response.ok) throw new Error(`Erro API: ${response.status}`);

        const data = await response.json();
        const content = data.choices[0].message.content;
        const parsed = JSON.parse(content.replace(/```json\n?|```/g, "").trim());

        if (inputContainer) inputContainer.classList.add("hidden");
        renderizarPainelPortfolio(parsed);

    } catch (error) {
        display.innerHTML = `<div class="p-4 bg-red-950/40 border border-red-900 text-red-300 text-sm rounded-xl">⚠️ Erro: ${error.message}</div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Extrair Catálogo de Veículos`;
    }
}
window.analisarComGroq = analisarComGroq;

function renderizarPainelPortfolio(data) {
    const display = document.getElementById("display-area");
    if (!display) return;

    const grupos = data.grupos_de_assimetria || [];
    const descartados = data.veiculos_descartados || [];
    const destaque = data.veiculo_destaque || null;

    // Badges de Criticidade (Design restaurado, mas para ser alinhado no fluxo)
    const getCriticidadeBadge = (crit) => {
        const c = (crit || 'media').toLowerCase();
        if (c === 'alta') return `<span class="px-2 py-0.5 rounded text-[9px] font-black uppercase bg-red-500/20 text-red-400 border border-red-500/30"><i class="fa-solid fa-fire mr-1"></i>Alta</span>`;
        if (c === 'media') return `<span class="px-2 py-0.5 rounded text-[9px] font-black uppercase bg-amber-500/20 text-amber-400 border border-amber-500/30"><i class="fa-solid fa-gauge-high mr-1"></i>Média</span>`;
        return `<span class="px-2 py-0.5 rounded text-[9px] font-black uppercase bg-blue-500/20 text-blue-400 border border-blue-500/30">Baixa</span>`;
    };

    // Cores de Perfil
    const getPerfilColor = (perfil) => {
        const p = (perfil || '').toLowerCase();
        if (p === 'principal') return 'text-accent font-bold';
        if (p === 'protecao') return 'text-amber-400';
        if (p === 'valor') return 'text-emerald-400';
        return 'text-blue-400';
    };

    let htmlGrupos = grupos.map((g) => {
        const veiculos = (g.catalogo_de_veiculos || []);

        const htmlVeiculos = veiculos.map(v => `
            <div class="bg-base-card border border-base-border hover:border-accent/50 rounded-xl p-4 flex flex-col justify-between space-y-3 transition-all relative overflow-hidden group">
                
                <!-- Destaque visual sutil no topo do card -->
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-base-border group-hover:via-accent/50 to-transparent"></div>

                <!-- Header do Card: Mercado e Score -->
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">${v.tipo_veiculo}</span>
                    <span class="text-xs font-black px-2 py-0.5 rounded bg-base-bg text-emerald-400 border border-emerald-500/20 shadow-inner">
                        Score: ${v.moneyball_score ?? '-'}
                    </span>
                </div>

                <!-- Corpo do Card: A Aposta (Bilhete Style) -->
                <div class="py-1">
                    <div class="text-lg font-extrabold text-white tracking-tight">${v.selecao}</div>
                    ${v.odd ? `<div class="text-[10px] text-slate-500 mt-0.5">Odd Ref: <span class="text-slate-300 font-mono">${v.odd}</span></div>` : ''}
                </div>

                <!-- Footer do Card: Metadados Limpos -->
                <div class="pt-2 border-t border-base-border/60 flex items-center justify-between text-[10px] uppercase font-mono">
                    <span class="${getPerfilColor(v.perfil_veiculo)}">${v.perfil_veiculo || 'Veículo'}</span>
                    <span class="${v.grau_dependencia === 'correlacionado' ? 'text-purple-400' : 'text-slate-500'}">
                        ${v.grau_dependencia || 'independente'}
                    </span>
                </div>
            </div>
        `).join("");

        return `
            <div class="bg-base-panel border border-base-border rounded-2xl p-5 space-y-4 shadow-lg shadow-black/20">
                <!-- Header da Assimetria (Alinhado e no Esquadro) -->
                <div class="border-b border-base-border pb-3 space-y-2">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="px-2 py-0.5 rounded bg-accent/20 text-accent font-mono text-xs font-black">${g.id_assimetria || 'A'}</span>
                        <h4 class="font-bold text-white text-sm">${g.titulo_original_nexus}</h4>
                        <div class="ml-auto"> <!-- Empurra a criticidade pro lado sem quebrar a altura -->
                            ${getCriticidadeBadge(g.criticidade)}
                        </div>
                    </div>
                    <!-- Resumo com line-clamp-2 para não poluir -->
                    <p class="text-[11px] text-slate-400 leading-relaxed line-clamp-2" title="${g.descricao_nexus}">${g.descricao_nexus}</p>
                </div>
                
                <!-- Grid de Veículos -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${htmlVeiculos}
                </div>
            </div>
        `;
    }).join("");

    display.innerHTML = `
        <div class="space-y-6">
            <!-- BARRA DE TOPO & VEÍCULO DESTAQUE -->
            <div class="p-5 bg-gradient-to-r from-accent/20 via-base-panel to-base-panel border border-accent/30 rounded-2xl space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-[10px] font-bold tracking-widest text-accent uppercase"><i class="fa-solid fa-car-side mr-1"></i> Catálogo Cortex-Ready</span>
                    </div>
                    <button type="button" onclick="reexibirInput()" class="px-3 py-1.5 bg-base-card hover:bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold border border-base-border transition-all cursor-pointer">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Nova Extração
                    </button>
                </div>

                ${destaque ? `
                    <div class="p-4 bg-emerald-950/20 border border-emerald-500/30 rounded-xl flex items-center justify-between">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-mono text-[9px] font-black">${destaque.id_assimetria_origem || 'A1'}</span>
                                <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-trophy mr-1"></i> Veículo Alpha</span>
                            </div>
                            <div class="text-sm">
                                <span class="text-slate-400">${destaque.tipo_veiculo} ➔ </span>
                                <b class="text-white text-base">${destaque.selecao}</b>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-black text-emerald-400 font-mono drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]">${destaque.moneyball_score}</span>
                        </div>
                    </div>
                ` : ''}
            </div>

            <!-- GRUPOS DE ASSIMETRIA -->
            ${htmlGrupos}

            <!-- DESCARTES PADRONIZADOS (Mais discretos) -->
            ${descartados.length > 0 ? `
                <div class="bg-base-panel/50 border border-base-border border-dashed rounded-xl p-4 space-y-2">
                    <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider"><i class="fa-solid fa-filter text-amber-500/70 mr-1.5"></i> Veículos Filtrados (Redundância/Score)</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
                        ${descartados.map(d => `
                            <div class="text-[10px] text-slate-400 flex items-start gap-1.5">
                                <i class="fa-solid fa-xmark text-red-400/70 mt-0.5"></i>
                                <span><b class="text-slate-300">${d.selecao}</b>: ${d.motivo}</span>
                            </div>
                        `).join("")}
                    </div>
                </div>
            ` : ""}
        </div>
    `;
}
</script>
</body>
</html>
