<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneyball Bet Builder | Suas Entradas do Dia</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        display: ['"Bebas Neue"', 'sans-serif'],
                    },
                    colors: {
                        base: { bg: '#0a0c10', panel: '#12151c', card: '#171b22', border: '#262b35' },
                        accent: { DEFAULT: '#f2b134', dim: '#caa233', soft: '#f2b13422' },

                }
            }
        }

    <style>
        /* Assinatura visual: cartela de "boletim de aposta" com perfuração lateral,

<body class="bg-base-bg text-slate-200 font-sans min-h-screen" style="background-image: radial-gradient(circle at 50% -10%, rgba(242,177,52,0.07), transparent 55%);">
    <div class="max-w-3xl mx-auto p-4 md:p-8 space-y-6">

        <!-- HEADER -->
        <div class="text-center space-y-1.5 pt-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accent/10 border border-accent/25 text-[10px] font-bold text-accent tracking-widest uppercase">
                <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span> Pronto pra analisar seu jogo
            </div>
            <h1 class="font-display text-4xl md:text-5xl text-white tracking-wide">MONEYBALL <span class="text-accent">BET BUILDER</span></h1>
            <p class="text-xs text-slate-500">Cole o dossiê da partida e veja as melhores entradas, sem enrolação.</p>
        </div>

        <!-- ÁREA DE ENTRADA -->
        <div id="input-container" class="space-y-6">
            <div id="sport-tabs" class="grid grid-cols-3 gap-2"></div>

            <details class="bg-base-panel border border-base-border rounded-2xl p-4">
                <summary class="cursor-pointer text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-key text-accent"></i> Sua chave da API Groq
                </summary>
                <div class="mt-4 space-y-2">
                    <label class="text-[10px] text-slate-500 font-bold tracking-widest">CHAVE GROQ (fica salva só no seu navegador)</label>
                    <input type="password" id="groq-key" placeholder="gsk_..." class="w-full bg-base-bg p-2.5 rounded-lg border border-base-border text-white text-sm font-mono" onchange="salvarKey(this.value)">
                </div>
            </details>

            <div class="bg-base-panel border border-base-border rounded-2xl p-6 space-y-3">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-accent/20 text-accent text-xs font-bold flex items-center justify-center">1</span>
                    <label class="text-sm font-semibold text-slate-300">Cole o dossiê da partida (Nexus)</label>
                </div>
                <textarea id="json-input" class="w-full h-40 bg-base-bg p-3 rounded-lg border border-base-border font-mono text-xs text-value" placeholder='Cole aqui o dossiê investigativo do jogo...'></textarea>
                <button id="analisar-btn" type="button" onclick="analisarComGroq()" class="w-full py-3.5 bg-accent hover:bg-accent-dim font-bold rounded-xl text-base-bg shadow-lg shadow-accent/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-bolt"></i> Buscar Minhas Entradas
                </button>
            </div>
        </div>

        <!-- DISPLAY DE RESULTADOS -->
        <div id="display-area"></div>
    </div>

<script>
function salvarKey(val) {
    if (val) localStorage.setItem("moneyball_groq_key", val.trim());
}

document.addEventListener("DOMContentLoaded", () => {
    buildSportTabs();
    const savedKey = localStorage.getItem("moneyball_groq_key");
    if (savedKey) {
        const input = document.getElementById("groq-key");
        if (input) input.value = savedKey;
    }
});

function reexibirInput() {
    const inputContainer = document.getElementById("input-container");
    const display = document.getElementById("display-area");
    const jsonInput = document.getElementById("json-input");
    if (inputContainer) inputContainer.classList.remove("hidden");
    if (display) display.innerHTML = "";
    if (jsonInput) jsonInput.focus();
}
window.reexibirInput = reexibirInput;

const MODULES = {
    beisebol: { label: "Beisebol", icon: "fa-baseball" },
    futebol: { label: "Futebol", icon: "fa-futbol" },
    basquete: { label: "Basquete", icon: "fa-basketball" }
};

let sportAtivo = "futebol";

function buildSportTabs() {
    const container = document.getElementById("sport-tabs");
    if (!container) return;
    container.innerHTML = Object.entries(MODULES).map(([key, mod]) => `
        <button type="button" onclick="selecionarSport('${key}')" id="tab-${key}" class="py-3 px-4 rounded-xl border text-xs font-bold flex items-center justify-center gap-2 transition-all cursor-pointer ${key === sportAtivo ? 'bg-accent/15 border-accent text-accent shadow-lg shadow-accent/10' : 'bg-base-panel border-base-border text-slate-400 hover:border-slate-700'}">
            <i class="fa-solid ${mod.icon}"></i> ${mod.label}
        </button>
    `).join("");
}

function selecionarSport(key) {
    sportAtivo = key;
    buildSportTabs();
}
window.selecionarSport = selecionarSport;

// ============================================================
// SYSTEM PROMPT — mesmo contrato de dados do v22.0 (schema JSON
// inalterado, pra não quebrar nada que já funciona), mas com uma
// instrução nova: todo texto livre é escrito como um apostador
// experiente falando com outro apostador — nunca "veículo",
// "grau de dependência", "redundância estrutural" ou jargão
// técnico dentro das frases explicativas.
// ============================================================
function montarSystemPrompt(esporte) {
  return `Você é o Moneyball Bet Builder (Tradutor Técnico) para: ${esporte.toUpperCase()}.

[0. CATÁLOGO DE MERCADOS PERMITIDOS (RÍGIDO — NÃO EXTRAPOLAR)]
Toda entrada gerada em "catalogo_de_veiculos" ou "veiculo_destaque" DEVE pertencer a um destes mercados, por esporte. Nenhum outro mercado é permitido, mesmo que o Nexus tenha mapeado uma assimetria clara sobre ele:

- BEISEBOL: Money Line | Handicap de Corridas / Vencedor (Run Line) | Total de Corridas na Partida | Money Line F5 (Primeiras 5 Entradas) | Total de Corridas F5
- BASQUETE: Money Line | Handicap de Pontos | Total de Pontos
- FUTEBOL: Chance Dupla | Handicap Asiático/Europeu de Gols | Total de Gols na Partida | Resultado do Intervalo (1º Tempo)

PROIBIDO gerar entradas de escanteios, cartões, chutes a gol, faltas, props de jogador, ou qualquer mercado fora dessa lista, mesmo que a assimetria do Nexus aponte claramente pra esse tipo de vantagem.

SE uma assimetria de intensidade "alta" só puder ser expressa de forma fiel por um mercado FORA dessa lista (ex: a vantagem é fundamentalmente sobre volume de escanteios, sem nenhuma tradução razoável pra Total de Gols/Handicap/Chance Dupla): NÃO force essa assimetria para dentro de um mercado permitido só pra caber. Descarte essa assimetria inteira, adicionando-a a "veiculos_descartados" com "categoria_descarte": "fora_do_escopo" e o motivo explicando (em tom de apostador) que o app não opera esse tipo de mercado no momento.

------------------------------------------------

A FILOSOFIA (REGRA DE OURO):
O objetivo do Bet Builder NÃO é selecionar apostas por conta própria. O objetivo não é produzir o maior número de opções. O objetivo é produzir o MENOR conjunto de entradas capaz de representar todas as vantagens estatísticas identificadas pelo Nexus.
Você NÃO analisa a partida, NÃO reinterpreta os dados e NÃO cria variáveis fora do Dossiê. Você apenas traduz a leitura do Nexus para o mercado.

TOM DE ESCRITA (IMPORTANTE — NOVO):
Todos os campos de texto livre ("perfil_de_jogo", "motivo_sem_conversao", "justificativa_destaque", "porque_este_veiculo", "motivo" dos descartes) devem ser escritos como um apostador experiente explicando a jogada pra outro apostador — direto, sem jargão técnico e sem a palavra "veículo". Diga "essa entrada", "essa aposta" ou "essa seleção". Nunca escreva "grau de dependência", "redundância estrutural" ou termos de engenharia dentro dessas frases — traduza a ideia em linguagem natural (ex: em vez de "redundância estrutural com A2", escreva "essa aqui cobre a mesma vantagem que a de cima, então não faz sentido entrar nas duas").

CONCEITO INTERNO (não aparece pro usuário, só orienta sua lógica):
Uma mesma vantagem estatística pode ser capturada por mais de uma entrada de mercado diferente. Entradas diferentes podem pertencer ao mesmo "mercado" macro, desde que capturem a vantagem por mecanismos distintos.

REGRAS DE ARQUITETURA E TRADUÇÃO:
1. VOLUME INTELIGENTE: Se nenhuma segunda entrada tiver qualidade estatística parecida com a principal, retorne APENAS UMA. Não force uma lista só pra parecer mais completo.
2. PROIBIDO REDUNDÂNCIA: Nunca gere duas entradas que sejam versões mais "puxadas" da mesma linha (ex: NUNCA Over 2.5 e Over 3.5 pra mesma tese).
3. REDUNDÂNCIA CRUZADA (ENTRE SINAIS): Sempre que sinais diferentes gerarem entradas muito parecidas entre si (ex: Over 2.5 em um sinal e Ambas Marcam em outro), mantenha só a de maior Moneyball Score e descarte as demais por "redundancia_estrutural" (categoria interna — não usar essa palavra no texto explicativo pro usuário).
4. ORIGEM DOS DADOS:
   - A "criticidade" reflete EXCLUSIVAMENTE a importância estatística atribuída pelo Nexus.
   - O "Moneyball Score" é calculado EXCLUSIVAMENTE com base no Dossiê Nexus. Nunca introduza fatores externos.
5. ORDENAÇÃO: ordene os grupos por criticidade (Alta > Média > Baixa) e, dentro de cada grupo, as entradas pelo Moneyball Score, do maior pro menor.
6. DEFINIÇÃO DE CORRELAÇÃO ("grau_dependencia", campo interno):
   - "independente" = pode entrar junto com outras apostas do bilhete sem problema.
   - "correlacionado" = só faz sentido separado, porque depende do resultado de outra entrada.
7. DESCARTES PADRONIZADOS (categoria interna): "baixo_score", "redundancia_estrutural", "alta_variancia", "linha_ineficiente", "fora_do_escopo".

FORMATO DE SAÍDA — EXCLUSIVAMENTE JSON VÁLIDO (schema mantido igual para compatibilidade):
{
  "perfil_de_jogo": "Síntese textual vinda estritamente do Nexus, em tom de apostador...",
  "status_conversao": "convertido|sem_conversao",
  "motivo_sem_conversao": null,
  "veiculo_destaque": {
    "id_assimetria_origem": "A1",
    "titulo_assimetria_origem": "Título do sinal de origem",
    "tipo_veiculo": "Nome do mercado (ex: Total de Gols)",
    "selecao": "Seleção Exata (ex: Mais de 2.5 Gols)",
    "moneyball_score": 91.5,
    "motivo_dominancia": "maior_score",
    "justificativa_destaque": "Explicação em tom de apostador, baseada estritamente no Score e no Dossiê."
  },
  "grupos_de_assimetria": [
    {
      "id_assimetria": "A1",
      "natureza": "Processo/Volume | Margem/Resultado | Ritmo/Intensidade",
      "criticidade": "alta|media|baixa",
      "titulo_original_nexus": "Título exatamente igual ao Nexus",
      "descricao_nexus": "Descrição exatamente igual ao Nexus",
      "catalogo_de_veiculos": [
        {
          "tipo_veiculo": "Nome do mercado",
          "selecao": "Seleção Exata",
          "moneyball_score": 89.0,
          "odd": "1.85",
          "perfil_veiculo": "principal|alternativo|protecao|valor|piso",
          "confianca_da_conversao": "alta|media|baixa",
          "grau_dependencia": "independente|correlacionado",
          "assimetrias_relacionadas": ["A1"],
          "porque_este_veiculo": "Motivo direto, em tom de apostador."
        }
      ]
    }
  ],
  "veiculos_descartados": [
    {
      "tipo_veiculo": "Nome do mercado rejeitado",
      "selecao": "Seleção Rejeitada",
      "categoria_descarte": "baixo_score|redundancia_estrutural|alta_variancia|linha_ineficiente|fora_do_escopo",
      "motivo": "Explicação direta, em tom de apostador, sem jargão técnico."
    }
  ]
}`;
}

async function analisarComGroq() {
    const apiKeyInput = document.getElementById("groq-key");
    const jsonInput = document.getElementById("json-input");
    const btn = document.getElementById("analisar-btn");
    const display = document.getElementById("display-area");
    const inputContainer = document.getElementById("input-container");

    if (!apiKeyInput || !jsonInput || !btn || !display) return;

    const apiKey = apiKeyInput.value.trim() || localStorage.getItem("moneyball_groq_key");
    const raw = jsonInput.value.trim();

    if (!apiKey) {
        display.innerHTML = alertaErro("Cole sua chave da API Groq antes de continuar.");
        apiKeyInput.focus();
        return;
    }
    if (!raw) {
        display.innerHTML = alertaErro("Cole o dossiê da partida antes de buscar as entradas.");
        jsonInput.focus();
        return;
    }

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Buscando as melhores entradas...`;
    display.innerHTML = `
        <div class="bg-base-panel border border-base-border rounded-2xl p-8 text-center space-y-3 animate-pulse">
            <i class="fa-solid fa-ticket text-accent text-3xl"></i>
            <h3 class="text-sm font-semibold text-slate-300">Cruzando os sinais do jogo com as odds...</h3>
            <p class="text-xs text-slate-500">Filtrando o que tem valor de verdade e descartando repetições.</p>
        </div>
    `;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: montarSystemPrompt(MODULES[sportAtivo].label) },
                    { role: "user", content: raw }
                ],
                temperature: 0.1,
                response_format: { type: "json_object" }
            })
        });

        if (!response.ok) throw new Error(`Erro na API (${response.status})`);

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content || "";
        const parsed = JSON.parse(content.replace(/```json\n?|```/g, "").trim());

        // Limpa a caixa de texto só depois de uma análise bem-sucedida
        // (se der erro, o texto colado continua lá pra tentar de novo).
        jsonInput.value = "";

        if (inputContainer) inputContainer.classList.add("hidden");
        renderizarPainelPortfolio(parsed);

    } catch (error) {
        console.error(error);
        display.innerHTML = alertaErro(`Não deu pra analisar: ${error.message}`);
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Buscar Minhas Entradas`;
    }
}
window.analisarComGroq = analisarComGroq;

function alertaErro(msg) {
    return `<div class="bg-red-950/40 border border-red-900 text-red-300 text-sm p-4 rounded-xl">⚠️ ${msg}</div>`;
}

// ============================================================
// RENDERIZAÇÃO — linguagem 100% de apostador, sem "veículo"
// aparecendo em nenhum texto visível na tela.
// ============================================================
function renderizarPainelPortfolio(data) {
    const display = document.getElementById("display-area");
    if (!display) return;

    if (data.status_conversao === "sem_conversao") {
        display.innerHTML = `
            <div class="bg-base-panel border border-amber-500/25 rounded-2xl p-6 space-y-4 fade-up">
                <div class="flex items-center gap-2 text-accent font-bold text-sm">
                    <i class="fa-solid fa-shield-halved text-lg"></i> SEM ENTRADA RECOMENDADA HOJE
                </div>
                ${data.perfil_de_jogo ? `<div class="p-3 bg-base-bg rounded-xl border border-base-border text-xs text-slate-300">${data.perfil_de_jogo}</div>` : ""}
                <div class="p-4 bg-amber-950/10 border border-amber-900/30 rounded-xl text-xs text-amber-200">
                    ${data.motivo_sem_conversao || "Nenhuma aposta apresentou segurança suficiente pra entrar nesse jogo."}
                </div>
                <button type="button" onclick="reexibirInput()" class="w-full py-2.5 bg-base-card hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold border border-base-border transition-all cursor-pointer">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Analisar outro jogo
                </button>
            </div>
        `;
        return;
    }

    const grupos = data.grupos_de_assimetria || [];
    const descartados = data.veiculos_descartados || [];
    const destaque = data.veiculo_destaque || null;

    const rotuloCriticidade = (crit) => {
        const c = (crit || 'media').toLowerCase();
        if (c === 'alta') return `<span class="px-2 py-0.5 rounded text-[10px] font-black uppercase bg-risk/15 text-risk border border-risk/30"><i class="fa-solid fa-fire mr-1"></i>Sinal Forte</span>`;
        if (c === 'media') return `<span class="px-2 py-0.5 rounded text-[10px] font-black uppercase bg-accent/15 text-accent border border-accent/30"><i class="fa-solid fa-gauge-high mr-1"></i>Sinal Médio</span>`;
        return `<span class="px-2 py-0.5 rounded text-[10px] font-black uppercase bg-slate-700/30 text-slate-400 border border-slate-600/40">Sinal Leve</span>`;
    };

    const rotuloConfianca = (conf) => {
        const c = (conf || 'alta').toLowerCase();
        if (c === 'alta') return `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-value/10 text-value border border-value/20" title="Confiança">Confiança Alta</span>`;
        if (c === 'media') return `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-accent/10 text-accent border border-accent/20" title="Confiança">Confiança Média</span>`;
        return `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-risk/10 text-risk border border-risk/20" title="Confiança">Confiança Baixa</span>`;
    };

    const rotuloPerfil = (perfil) => {
        const mapa = {
            principal: { texto: "Favorita", estilo: "bg-accent/20 text-accent border border-accent/30" },
            alternativo: { texto: "Alternativa", estilo: "bg-sky-500/20 text-sky-400 border border-sky-500/30" },
            protecao: { texto: "Proteção", estilo: "bg-slate-600/30 text-slate-300 border border-slate-500/40" },
            valor: { texto: "Valor", estilo: "bg-value/20 text-value border border-value/30" },
            piso: { texto: "Mais Segura", estilo: "bg-slate-700/40 text-slate-300 border border-slate-600" },
        };
        const p = mapa[(perfil || 'principal').toLowerCase()] || { texto: "Opção", estilo: "bg-slate-800 text-slate-400 border border-slate-700" };
        return `<span class="text-[9px] font-bold px-2 py-0.5 rounded uppercase ${p.estilo}">${p.texto}</span>`;
    };

    const rotuloCombina = (grau) => {
        const correlacionado = (grau || '').toLowerCase() === 'correlacionado';
        return correlacionado
            ? `<span class="text-[9px] font-semibold px-2 py-0.5 rounded bg-purple-500/15 text-purple-300 border border-purple-500/30 uppercase" title="Não combine com outra entrada do mesmo sinal">Entrada única</span>`
            : `<span class="text-[9px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 uppercase" title="Pode combinar com outras entradas">Combina no bilhete</span>`;
    };

    const categoriaDescarte = {
        baixo_score: "Score baixo",
        redundancia_estrutural: "Repetia outra entrada",
        alta_variancia: "Risco alto demais",
        linha_ineficiente: "Linha sem valor",
        fora_do_escopo: "Mercado ainda não coberto",
    };

    let htmlGrupos = grupos.map((g, idx) => {
        const opcoes = (g.catalogo_de_veiculos || []);

        const htmlOpcoes = opcoes.map(v => `
            <div class="p-3.5 bg-base-card rounded-xl border border-accent/15 space-y-2.5 hover:border-accent/40 transition-all">
                <div class="flex justify-between items-start gap-2">
                    <div>
                        <div class="flex items-center gap-1.5 flex-wrap">
                            ${rotuloPerfil(v.perfil_veiculo)}
                            ${rotuloCombina(v.grau_dependencia)}
                            ${rotuloConfianca(v.confianca_da_conversao)}
                        </div>
                        <h5 class="font-bold text-slate-100 text-xs mt-1.5">${v.tipo_veiculo}</h5>
                    </div>
                    <div class="text-right shrink-0">
                        <span class="text-xs font-black px-2 py-1 rounded bg-value/15 text-value border border-value/30 inline-block font-mono">
                            ${v.moneyball_score ?? '-'}
                        </span>
                    </div>
                </div>

                <div class="flex justify-between items-center bg-base-bg p-2 rounded-lg border border-base-border text-xs">
                    <span class="text-accent font-black">${v.selecao}</span>
                    ${v.odd ? `<span class="text-slate-400 text-[11px] font-mono">Odd <b class="text-white">${v.odd}</b></span>` : '<span class="text-slate-600 text-[10px]">Odd não informada</span>'}
                </div>

                ${v.porque_este_veiculo ? `<p class="text-[11px] text-slate-400 leading-relaxed">${v.porque_este_veiculo}</p>` : ''}

                ${(v.assimetrias_relacionadas && v.assimetrias_relacionadas.length > 1) ? `
                    <div class="text-[10px] text-slate-500 pt-1 border-t border-base-border/50">
                        <i class="fa-solid fa-link text-accent"></i> Essa entrada já cobre mais de um sinal do jogo.
                    </div>
                ` : ''}
            </div>
        `).join("");

        return `
            <div class="bg-base-panel border border-base-border rounded-2xl p-5 space-y-4 fade-up" style="animation-delay:${idx * 60}ms">
                <div class="border-b border-base-border pb-3 flex justify-between items-start gap-3">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 flex items-center justify-center rounded-full bg-accent/15 text-accent font-mono text-[11px] font-black">${idx + 1}</span>
                            <h4 class="font-bold text-white text-sm">${g.titulo_original_nexus}</h4>
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed">${g.descricao_nexus}</p>
                    </div>
                    <div class="shrink-0">${rotuloCriticidade(g.criticidade)}</div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${htmlOpcoes}
                </div>
            </div>
        `;
    }).join("");

    display.innerHTML = `
        <div class="space-y-6">
            <!-- ENTRADA PRINCIPAL: assinatura visual de boletim de aposta -->
            ${destaque ? `
                <div class="betslip rounded-2xl p-5 md:p-6 space-y-3 fade-up" style="--slip-bg:#171307;">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                        <span class="text-[10px] font-bold text-accent uppercase tracking-widest"><i class="fa-solid fa-trophy mr-1"></i> Melhor Entrada do Jogo</span>
                        <span class="text-xs font-black px-2.5 py-1 rounded bg-value/15 text-value border border-value/30 font-mono">
                            Score ${destaque.moneyball_score}
                        </span>
                    </div>
                    <div class="tear-divider pt-3">
                        <p class="text-[11px] text-slate-500 uppercase tracking-wide">${destaque.titulo_assimetria_origem || 'Sinal principal do jogo'}</p>
                        <div class="flex items-baseline gap-2 flex-wrap mt-1">
                            <h2 class="font-display text-2xl md:text-3xl text-white tracking-wide">${destaque.tipo_veiculo}</h2>
                        </div>
                        <p class="text-accent font-black text-lg mt-0.5">${destaque.selecao}</p>
                    </div>
                    ${destaque.justificativa_destaque ? `<p class="text-xs text-slate-400 leading-relaxed pt-1">${destaque.justificativa_destaque}</p>` : ''}
                </div>
            ` : ''}

            <!-- CABEÇALHO DA ANÁLISE + BOTÃO NOVA ANÁLISE -->
            <div class="flex items-center justify-between px-1">
                <p class="text-xs text-slate-400">${data.perfil_de_jogo || "Análise completa do jogo, sinal por sinal."}</p>
                <button type="button" onclick="reexibirInput()" class="shrink-0 px-3 py-1.5 bg-base-card hover:bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold border border-base-border transition-all cursor-pointer">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Novo jogo
                </button>
            </div>

            <!-- GRUPOS DE SINAIS -->
            ${htmlGrupos}

            <!-- DESCARTES -->
            ${descartados.length > 0 ? `
                <details class="bg-base-panel border border-base-border rounded-2xl p-5 fade-up">
                    <summary class="cursor-pointer text-xs font-bold text-slate-400 uppercase tracking-wider">
                        <i class="fa-solid fa-eye-slash text-slate-500 mr-1.5"></i> Ver o que ficou de fora (${descartados.length})
                    </summary>
                    <div class="space-y-2 mt-3">
                        ${descartados.map(d => `
                            <div class="p-2.5 bg-base-bg rounded-lg text-xs text-slate-400 border border-base-border flex justify-between items-start gap-2">
                                <div><b class="text-slate-300">${d.tipo_veiculo} (${d.selecao}):</b> ${d.motivo}</div>
                                <span class="text-[9px] font-mono text-slate-500 bg-slate-800/60 px-2 py-0.5 rounded border border-slate-700 uppercase whitespace-nowrap shrink-0">
                                    ${categoriaDescarte[d.categoria_descarte] || 'Descartada'}
                                </span>
                            </div>
                        `).join("")}
                    </div>
                </details>
            ` : ""}
        </div>
    `;
}
</script>
</body>
</html>
