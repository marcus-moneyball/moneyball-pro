function validarDadosMinimos(dadosNexus, moduloAtivoKey) {
    const str = JSON.stringify(dadosNexus).toLowerCase();
    const termosEsportes = {
        futebol: ["xg", "xga", "escanteios", "cartoes", "1x2", "chance dupla", "dupla hipotese", "half time", "gols", "futebol", "corners"],
        beisebol: ["pitcher", "era", "whip", "innings", "runs", "strikeouts", "mlb", "home runs", "beisebol"],
        basquete: ["rebotes", "assistencias", "pontos", "nba", "quarto", "triplos", "basquete", "handicap"]
    };

    let esporteDetectado = null;
    let maxHits = 0;

    for (const [esporte, termos] of Object.entries(termosEsportes)) {
        const hits = termos.filter(t => str.includes(t)).length;
        if (hits > maxHits && hits >= 2) {
            maxHits = hits;
            esporteDetectado = esporte;
        }
    }

    if (esporteDetectado && esporteDetectado !== moduloAtivoKey) {
        const nomeDetectado = MODULES[esporteDetectado]?.label || esporteDetectado;
        const nomeAtivo = MODULES[moduloAtivoKey]?.label || moduloAtivoKey;
        return {
            ok: false,
            erro: `Você colou um JSON de <b>${nomeDetectado}</b>, mas a aba selecionada é <b>${nomeAtivo}</b>. Alterne a aba acima para continuar.`
        };
    }

    return { ok: true };
}

function montarSystemPrompt(esporte) {
  return `Você é o Moneyball Bet Builder Engine v18.0 para o esporte: ${esporte.toUpperCase()}.

SUA MISSÃO:
Sua única função é converter a natureza estatística das assimetrias do Nexus v2.4 em mercados eficientes e de alto valor esperado (EV+).
Você NÃO interpreta novamente o jogo.
Você NÃO cria novas hipóteses.
O Nexus define qual vantagem existe, sua intensidade, sua persistência, seu escopo temporal e sua dependência de resultado. O Bet Builder apenas encontra o veículo de conversão com menor ruído.

------------------------------------------------

[0. CATÁLOGO DE MERCADOS POR ESPORTE]
Use exclusivamente estes mercados, mapeados por "slot":

- BEISEBOL: 
  * Slot ML → "Money Line"
  * Slot Spread → "Handicap de Corridas / Vencedor (Run Line)"
  * Slot Total → "Total de Corridas na Partida"
  * Slot Segmento (opcional) → "Money Line F5 (Primeiras 5 Entradas)" e/ou "Total de Corridas F5"
- BASQUETE:
  * Slot ML → "Money Line"
  * Slot Spread → "Handicap de Pontos"
  * Slot Total → "Total de Pontos"
  * (sem slot de Segmento nesta versão)
- FUTEBOL:
  * Slot ML → "Chance Dupla" (substitui 1X2/Vencedor seco — opções: "1X", "2X", "12")
  * Slot Spread → "Handicap Asiático/Europeu de Gols"
  * Slot Total → "Total de Gols na Partida"
  * Slot Segmento (opcional) → "Resultado do Intervalo (1º Tempo)" — usar também Chance Dupla do 1º tempo quando aplicável (ex: "1X no 1º Tempo")

PROIBIDO usar "1X2", "Vencedor da Partida" ou "Moneyline seco" no futebol — sempre Chance Dupla no lugar, a menos que a divergência detectada seja de intensidade "alta" E confiança "alta" — mesmo assim, prefira Chance Dupla salvo instrução contrária explícita.

------------------------------------------------

[1. MATRIZ DE CONVERSÃO INTERNA (REGRA DE ROTEAMENTO DE ASSIMETRIAS)]
Siga rigorosamente a prioridade de conversão baseada na 'natureza_estatistica' informada pelo Nexus:

1. natureza_estatistica = "volume_quantidade"
   Prioridade:
   1. Totais (Gols, Pontos, Corridas, Escanteios, Chutes)
   2. Props de volume de atletas/equipe
   3. Mercados derivados de volume
   (Evitar mercados de desfecho do placar se dependencia_resultado == 'baixa')

2. natureza_estatistica = "margem_diferencial"
   Prioridade:
   1. Handicap / Spread
   2. Linhas alternativas de margem
   3. Money Line (somente se dependencia_resultado == 'alta')

3. natureza_estatistica = "probabilidade_binaria"
   Prioridade:
   1. Chance Dupla
   2. Money Line (obedece às TRAVAS DA SEÇÃO 2)
   3. Handicap conservador

4. natureza_estatistica = "eficiencia"
   Prioridade:
   1. Totais com piso estatístico alto (Floor Betting)
   2. Marcador de Ponto/Gol / Props de conversão individual
   3. Linhas conservadoras de margem

5. natureza_estatistica = "fragilidade"
   Prioridade:
   1. Mercados que exploram vulnerabilidade específica do adversário (ex: Over Team Total do atacante)
   2. Evitar mercados dependentes de domínio total da partida

------------------------------------------------

[2. TRAVAS DE SEGURANÇA EXTREMAS PARA MONEY LINE (ML)]
Mercados do tipo Money Line (ML seco / Vencedor Direto) sofrem penalização severa de viés. 
O mercado de Money Line SÓ PODE ser sugerido como seleção convertedora se TODAS as três condições abaixo forem satisfeitas simultaneamente:

1. 'natureza_estatistica' da assimetria == "probabilidade_binaria"
2. 'dependencia_resultado' da assimetria == "alta"
3. NÃO existe nenhuma assimetria concorrente de "volume_quantidade" ou "margem_diferencial" de intensidade igual ou superior no mesmo Dossiê.

Se qualquer uma dessas condições falhar, o uso de ML é estritamente PROIBIDO. Migre automaticamente para Chance Dupla ou Handicap Conservador.

------------------------------------------------

[3. GATE OBRIGATÓRIO DE DIVERGÊNCIA E VALOR — POR ASSIMETRIA (NEXUS ECHO)]
- O Dossiê Nexus traz "precificacao_local" DENTRO de cada assimetria. Identifique qual(is) assimetria(s) sustentam o mercado e copie o "precificacao_local" da assimetria de origem, sem alterar, para o campo "precificacao_nexus_echo" DENTRO desse item.
- Se "tipo_divergencia" da assimetria de origem == 'nenhuma' OU "mercado_reflete_esta_assimetria" == true: essa assimetria NÃO tem edge. Não converta nenhum mercado baseado só nela.
- Se tipo_divergencia != 'nenhuma' mas "intensidade" for 'baixa' OU "confianca_do_julgamento" for 'baixa': trate como edge fraco (sc máximo permitido = 74.9 — nunca Banda Verde).
- Se NENHUMA assimetria do dossiê tiver edge real: defina "status_conversao" como "sem_conversao" e limite as notas na qualidade do portfólio.

[3.1 GATE DE SEGMENTO (F5 / 1º TEMPO)]
- Antes de propor qualquer mercado do "Slot Segmento", verifique 'escopo_temporal' na assimetria e o bloco 'leitura_segmento_inicial'.
- Copie os valores de "vantagem_sustentada_no_segmento" e "forca_no_segmento" para "leitura_segmento_echo".
- Se "aplicavel" == false OU "vantagem_sustentada_no_segmento" == false OU 'escopo_temporal' == "segundo_tempo": PROIBIDO converter mercado do primeiro segmento — mova para "mercados_descartados".

------------------------------------------------

[4. CÁLCULO DO MONEYBALL SCORE (sc) - 0 a 100]
Pondere por mercado: 35% Força da Divergência, 30% Margem de Segurança (Floor Betting), 25% Encaixe Tático na Matriz de Conversão, 10% Baixa Dependência de Placar.
- 80.0 a 100.0 → BANDA VERDE
- 70.0 a 79.9 → BANDA AMARELA
- 0.0 a 69.9 → DESCARTADO

------------------------------------------------

SCHEMA JSON OBRIGATÓRIO (SAÍDA)

// ============================================================
// PARTE 3B: DIVERGENCE GATE v3.1 (Ajustado para Nexus v2.4 / Engine v18.0)
// ============================================================
const SCORE_MAXIMO_SEM_EDGE = 60.0;
const SCORE_MAXIMO_EDGE_FRACO = 74.9;

function semEdgeDetectado(echo) {
    if (!echo) return true;
    return (
        echo.tipo_divergencia === "nenhuma" ||
        echo.mercado_reflete_esta_assimetria === true
    );
}

function edgeFraco(echo) {
    if (!echo) return true;
    return echo.confianca_do_julgamento === "baixa";
}

const MERCADOS_DE_SEGMENTO = [
    "money line f5", "total de corridas f5", "resultado do intervalo", 
    "chance dupla no 1º tempo", "1x no 1º tempo", "2x no 1º tempo"
];

function ehMercadoDeSegmento(nomeMercado) {
    const nome = (nomeMercado || "").toLowerCase();
    return MERCADOS_DE_SEGMENTO.some((termo) => nome.includes(termo)) ||
           nome.includes("f5") || nome.includes("intervalo") || nome.includes("1º tempo");
}

function segmentoNaoSustentado(item) {
    if (!ehMercadoDeSegmento(item.m)) return false;
    
    // [NOVO v2.4] Se o escopo for restrito ao 2º tempo, descarte mercado de segmento inicial
    if (item.escopo_temporal === "segundo_tempo") return true;

    const leitura = item.leitura_segmento_echo;
    if (!leitura) return true;
    if (leitura.aplicavel_a_este_mercado === false) return true;
    if (leitura.vantagem_sustentada_no_segmento === false) return true;
    return false;
}

function avaliarItem(item) {
    const echo = item.precificacao_nexus_echo;
    const semEdge = semEdgeDetectado(echo);
    const fraco = edgeFraco(echo);
    const segmentoBloqueado = segmentoNaoSustentado(item);

    if (semEdge) {
        return {
            manter: false,
            motivo: "Gate de código: precificacao_nexus_echo indica tipo_divergencia 'nenhuma' (ou mercado_reflete_esta_assimetria=true) — sem edge nesta assimetria.",
            tetoScore: SCORE_MAXIMO_SEM_EDGE,
        };
    }

    if (segmentoBloqueado) {
        return {
            manter: false,
            motivo: "Gate de código: leitura_segmento_echo ou escopo_temporal indica que a vantagem não se sustenta no segmento inicial.",
            tetoScore: SCORE_MAXIMO_SEM_EDGE,
        };
    }

    if (fraco) {
        return {
            manter: true,
            motivo: null,
            tetoScore: SCORE_MAXIMO_EDGE_FRACO,
        };
    }

    return { manter: true, motivo: null, tetoScore: null };
}

function aplicarTetoScore(item, teto) {
    if (typeof item.sc === "number" && item.sc > teto) {
        item.sc = teto;
    }
    return item;
}

function aplicarDivergenceGate(respostaBetBuilder) {
    const resultado = structuredClone(respostaBetBuilder);

    const convertidas = Array.isArray(resultado.top_assimetrias_convertidas) ? resultado.top_assimetrias_convertidas : [];
    const mantidas = [];
    const rebaixadas = [];

    for (const item of convertidas) {
        const avaliacao = avaliarItem(item);

        if (!avaliacao.manter) {
            rebaixadas.push({
                m: item.m,
                s: item.s,
                assimetria_capturada: item.assimetria_capturada,
                tipo_de_ativo: item.tipo_de_ativo,
                sc: Math.min(item.sc ?? 0, avaliacao.tetoScore),
                status: "descartado",
                precificacao_nexus_echo: item.precificacao_nexus_echo,
                leitura_segmento_echo: item.leitura_segmento_echo,
                motivo: avaliacao.motivo,
            });
            continue;
        }

        if (avaliacao.tetoScore !== null) {
            aplicarTetoScore(item, avaliacao.tetoScore);
        }
        mantidas.push(item);
    }

    resultado.top_assimetrias_convertidas = mantidas;
    resultado.mercados_descartados = [
        ...(Array.isArray(resultado.mercados_descartados) ? resultado.mercados_descartados : []),
        ...rebaixadas,
    ];

    // Trava de consistência para o Mercado Ótimo
    if (resultado.mercado_otimo?.identificado && mantidas.length === 0) {
        resultado.mercado_otimo.identificado = false;
        resultado.mercado_otimo.motivo = "Gate de código: Nenhuma assimetria convertida foi aprovada no Gate de Divergência.";
    }

    const semNadaConvertido = resultado.top_assimetrias_convertidas.length === 0 && !resultado.mercado_otimo?.identificado;

    // [NOVO v18.0] Atualização da pontuação via objeto 'qualidade_portfolio'
    if (semNadaConvertido) {
        resultado.status_conversao = "sem_conversao";
        resultado.motivo_sem_conversao = resultado.motivo_sem_conversao || "Nenhuma assimetria com edge real foi confirmada pelo Gate de código.";
        
        if (resultado.qualidade_portfolio) {
            resultado.qualidade_portfolio.melhor_mercado = Math.min(resultado.qualidade_portfolio.melhor_mercado ?? 0, SCORE_MAXIMO_SEM_EDGE);
            resultado.qualidade_portfolio.media = Math.min(resultado.qualidade_portfolio.media ?? 0, SCORE_MAXIMO_SEM_EDGE);
        }
    }

    return resultado;
}

// PARTE 4: CHAMADA DA API GROQ
// ============================================================
async function analisarComGroq() {
    const apiKeyInput = document.getElementById("groq-key");
    const jsonInput = document.getElementById("json-input");
    const btn = document.getElementById("analisar-btn");
    const display = document.getElementById("display-area");

    if (!apiKeyInput || !jsonInput || !btn || !display) return;

    const apiKey = apiKeyInput.value.trim() || localStorage.getItem("moneyball_groq_key");
    const raw = jsonInput.value.trim();

    if (!apiKey) {
        display.innerHTML = alertaErro("Cole sua Groq API Key na seção de configuração acima primeiro.");
        apiKeyInput.focus();
        return;
    }
    if (!raw) {
        display.innerHTML = alertaErro("Cole o JSON do Nexus v2.2 antes de analisar.");
        jsonInput.focus();
        return;
    }

    try {
        const jsonParsed = JSON.parse(raw);
        const checagem = validarDadosMinimos(jsonParsed, sportAtivo);
        if (!checagem.ok) {
            display.innerHTML = alertaErro(checagem.erro);
            return;
        }
    } catch (e) {
        display.innerHTML = alertaErro("O texto colado não é um JSON válido. Verifique o formato inserido.");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Analisando Brechas & Game Script...`;
    display.innerHTML = `
        <div class="bg-base-panel border border-base-border rounded-2xl p-8 text-center space-y-3 animate-pulse">
            <i class="fa-solid fa-magnifying-glass-chart text-accent text-3xl"></i>
            <h3 class="text-sm font-semibold text-slate-300">Construindo Perfil de Jogo & Mapeando Linhas...</h3>
            <p class="text-xs text-slate-500">Filtrando apostas com menor risco e calibrando o Score.</p>
        </div>
    `;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: montarSystemPrompt(MODULES[sportAtivo].label) },
                    { role: "user", content: raw }
                ],
                temperature: 0.1,
                response_format: { type: "json_object" }
            })
        });

        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `Erro na API Groq (Status: ${response.status})`);
        }

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content || "";
        const cleanJson = content.replace(/```json\n?|```/g, "").trim();
        const parsedResult = JSON.parse(cleanJson);

        const resultadoValidado = aplicarDivergenceGate(parsedResult);
        renderizarPainel(resultadoValidado);

    } catch (error) {
        console.error("Erro na análise:", error);
        display.innerHTML = alertaErro(`Falha na execução: ${error.message}`);
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Analisar Oportunidades via Groq`;
    }
}
window.analisarComGroq = analisarComGroq;

function alertaErro(msg) {
    return `<div class="bg-red-950/40 border border-red-900 text-red-300 text-sm p-4 rounded-xl">⚠️ ${msg}</div>`;
}

// ============================================================
// PARTE 5: COMPONENTES DE RENDERIZAÇÃO
// ============================================================
function cardMercadoOtimo(mercadoOtimo) {
    if (!mercadoOtimo || !mercadoOtimo.identificado) return '';

    return `
        <div class="p-4 bg-gradient-to-r from-emerald-950/40 via-base-card to-base-card border border-emerald-500/40 rounded-xl space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 uppercase tracking-wider">
                    <i class="fa-solid fa-star mr-1"></i> Mercado Ótimo Identificado
                </span>
            </div>
            <h3 class="font-extrabold text-white text-base text-emerald-400">${mercadoOtimo.mercado || "Mercado não especificado"}</h3>
            <p class="text-xs text-slate-300 leading-relaxed">${mercadoOtimo.motivo || ""}</p>
        </div>
    `;
}

function cardAssimetriaConvertida(item) {
    if (!item || typeof item !== 'object') return '';

    const sc = item.sc ?? '-';
    const mercado = item.m || "Mercado";
    const selecao = item.s || "Seleção";
    const brecha = item.assimetria_capturada || "Não especificada";
    
    const tipoAtivoOriginal = item.tipo_de_ativo || "processo";
    const tipoAtivoFormatado = tipoAtivoOriginal === "processo" ? "Volume de Jogo" : "Placar / Vencedor";
    
    const oddsVal = item.odds ? `Odd: <span class="text-white font-mono font-bold">${item.odds}</span>` : "";
    const encaixe = item.forca_encaixe_nexus ? `${item.forca_encaixe_nexus}%` : "-";
    const depResultado = item.dependencia_resultado || "baixa";
    const explicacao = item.w || "";

    const depStyle = {
        baixa: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30",
        media: "bg-amber-500/15 text-amber-400 border-amber-500/30",
        alta: "bg-red-500/15 text-red-400 border-red-500/30"
    }[depResultado] || "bg-slate-700/20 text-slate-400 border-slate-700/40";

    return `
        <div class="p-4 bg-base-card rounded-xl border border-accent/30 hover:border-accent/60 transition-colors space-y-3">
            <div class="flex justify-between items-start gap-2">
                <div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-accent/20 text-accent uppercase tracking-wider">${tipoAtivoFormatado}</span>
                    <h4 class="font-bold text-slate-300 text-xs mt-1">${mercado}</h4>
                </div>
                <div class="text-right shrink-0">
                    <span class="text-xs font-black px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">Score: ${sc}</span>
                </div>
            </div>

            <div class="bg-accent/10 border border-accent/30 rounded-lg p-2.5 flex items-center justify-between">
                <span class="text-accent font-extrabold text-base">${selecao}</span>
                <span class="text-xs text-slate-300">${oddsVal}</span>
            </div>

            <div class="p-2.5 bg-base-bg rounded-lg border border-base-border text-xs space-y-1.5">
                <div class="text-slate-400"><strong class="text-slate-300">Vantagem do Jogo:</strong> ${brecha}</div>
                <div class="flex flex-wrap gap-2 pt-1 text-[10px]">
                    <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700"><i class="fa-solid fa-bullseye text-accent mr-1"></i>Aderência ao Cenário: ${encaixe}</span>
                    <span class="px-2 py-0.5 rounded border ${depStyle} uppercase font-bold">Risco de Placar: ${depResultado}</span>
                </div>
            </div>

            ${explicacao ? `<p class="text-xs text-slate-300 leading-relaxed pt-1">${explicacao}</p>` : ""}
        </div>`;
}

function cardMercadoDescartado(item) {
    if (!item || typeof item !== 'object') return '';

    const mercado = item.m || "Mercado";
    const selecao = item.s || "Seleção";
    const motivo = item.motivo || "Não especificado";
    const sc = item.sc ?? '-';

    return `
        <div class="p-3 bg-base-card/50 rounded-xl border border-red-900/30 text-xs space-y-1.5 opacity-85">
            <div class="flex justify-between items-center">
                <span class="font-bold text-slate-300">${mercado} (${selecao})</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-900/40 font-mono">Score: ${sc}</span>
            </div>
            <p class="text-slate-400 leading-relaxed"><strong class="text-red-400">Por que foi descartado:</strong> ${motivo}</p>
        </div>`;
}

// ============================================================
// PARTE 6: RENDERIZAÇÃO DO PAINEL PRINCIPAL (COMPLETA E CORRIGIDA)
// ============================================================
function renderizarPainel(data) {
    const display = document.getElementById("display-area");
    if (!display) return;

    const statusConversao = data.status_conversao || "convertido";
    const motivoSemConversao = data.motivo_sem_conversao || null;
    const perfilJogo = data.perfil_de_jogo || "";
    const prognostico = data.prognostico || "";
    const resumo = data.resumo || "";
    const scoreBilhete = data.score_bilhete ?? null;
    const mercadoOtimo = data.mercado_otimo || null;

    let convertidas = data.top_assimetrias_convertidas || [];
    if (!Array.isArray(convertidas)) convertidas = [convertidas];

    let descartados = data.mercados_descartados || [];
    if (!Array.isArray(descartados)) descartados = [descartados];

    if (statusConversao === "sem_conversao") {
        display.innerHTML = `
            <div class="bg-base-panel border border-amber-500/30 rounded-2xl p-6 space-y-4">
                <div class="flex items-center gap-2 text-amber-400 font-bold text-sm">
                    <i class="fa-solid fa-shield-halved text-lg"></i> JOGO SEM APOSTAS RECOMENDADAS
                </div>
                ${perfilJogo ? `<div class="p-3 bg-base-bg rounded-xl border border-base-border text-xs text-slate-300"><strong>Perfil do Jogo:</strong> ${perfilJogo}</div>` : ""}
                ${prognostico ? `<p class="text-xs text-slate-300 leading-relaxed">${prognostico}</p>` : ""}
                <div class="p-4 bg-amber-950/20 border border-amber-900/40 rounded-xl text-xs text-amber-200">
                    <strong>Motivo:</strong> ${motivoSemConversao || "Nenhum mercado apresentou segurança suficiente para entrada neste confronto."}
                </div>
            </div>
        `;
        return;
    }

    const painelResumoHtml = `
        <div class="p-4 bg-gradient-to-br from-accent/15 to-accent/5 border border-accent/30 rounded-xl space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-accent/20 text-accent uppercase tracking-wider">
                    <i class="fa-solid fa-chart-line mr-1"></i> Resumo Tático & Moneyball
                </span>
                ${scoreBilhete !== null ? `<span class="text-xs font-black px-2.5 py-1 rounded-lg bg-accent/20 text-accent border border-accent/30">Score Geral: ${scoreBilhete}</span>` : ""}
            </div>
            ${perfilJogo ? `<div class="p-2.5 bg-base-bg/60 rounded-lg border border-base-border text-xs text-slate-300"><strong>Perfil do Jogo:</strong> ${perfilJogo}</div>` : ""}
            ${prognostico ? `<p class="text-xs text-slate-300 leading-relaxed">${prognostico}</p>` : ""}
            ${resumo ? `<p class="text-xs text-slate-400 leading-relaxed border-t border-base-border/50 pt-2">${resumo}</p>` : ""}
        </div>
    `;

    const htmlConvertidas = convertidas.map(cardAssimetriaConvertida).join("");
    const htmlDescartadas = descartados.map(cardMercadoDescartado).join("");

    display.innerHTML = `
        <div class="bg-base-panel border border-base-border rounded-2xl p-6 space-y-6">
            ${painelResumoHtml}
            ${cardMercadoOtimo(mercadoOtimo)}

            ${convertidas.length > 0 ? `
                <div class="space-y-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-emerald-400"></i> Oportunidades Convertidas (${convertidas.length})
                    </h3>
                    <div class="space-y-3">${htmlConvertidas}</div>
                </div>
            ` : ""}

            ${descartados.length > 0 ? `
                <details class="group pt-2">
                    <summary class="cursor-pointer text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-400 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-circle-xmark text-red-400"></i> Mercados Descartados (${descartados.length})
                        <i class="fa-solid fa-chevron-down text-[10px] ml-auto transition-transform group-open:rotate-180"></i>
                    </summary>
                    <div class="space-y-2 mt-3">${htmlDescartadas}</div>
                </details>
            ` : ""}
        </div>
    `;
}
</script>
</body>
</html>
